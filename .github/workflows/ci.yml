name: Hungarian Edition 0.3.15 Qt5 and Qt6

on:
  push:
    branches: [hungarian-edition-beta4, hungarian-edition-dictionary-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobalt-hu-0315-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release helpers
        run: bash platforms/ci/test.sh

  build-qt5:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Kobo Qt5 firmware
        env:
          CONTAINER_ENGINE: docker
        run: bash platforms/ci/build.sh qt5
      - name: Version Qt5 ZIP
        run: |
          mv build/release/Kobalt-qt5.zip "build/release/Kobalt-Hungarian-Edition-0.3.15-qt5.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kobalt-hungarian-edition-0.3.15-qt5
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

  build-qt6:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Kobo Qt6 firmware
        env:
          CONTAINER_ENGINE: docker
        run: bash platforms/ci/build.sh qt6
      - name: Version Qt6 ZIP
        run: |
          mv build/release/Kobalt-qt6.zip "build/release/Kobalt-Hungarian-Edition-0.3.15-qt6.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kobalt-hungarian-edition-0.3.15-qt6
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
