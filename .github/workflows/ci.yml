name: Build and release

on:
  push:
    branches: [main, develop, hungarian-edition-beta8-integration]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobalt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_ENGINE: docker
  KOBALT_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  validation:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: echo "version=$(bash platforms/ci/version.sh)" >> "$GITHUB_OUTPUT"
      - name: Check release helpers
        run: bash platforms/ci/test.sh

  native-tests:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run native tests (all variants on tags)
        env:
          KOBALT_TEST_INTERFACE_LANGUAGE: en
        run: bash platforms/ci/native-tests.sh

  build-kobo-qt5:
    needs: [validation, native-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and verify Kobo Qt5 package
        env:
          KOBALT_RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        run: bash platforms/ci/build.sh qt5
      - name: Name ZIP for this Hungarian Edition build
        run: |
          name="Kobalt-Hungarian-Edition-Beta8-Build-${GITHUB_RUN_NUMBER}-Run-${GITHUB_RUN_ID}-Qt5"
          mv build/release/Kobalt-qt5.zip "build/release/${name}.zip"
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            build/release/Kobalt-Hungarian-Edition-Beta8-Build-*-Run-*-Qt5.zip
            build/release/build-qt5.json
          if-no-files-found: error
          compression-level: 0
