name: CPHUN224 Dictionary Morphology Qt5 Test

on:
  push:
    branches: [hungarian-edition-dictionary-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobalt-hu-dict-cphun224-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release helpers
        run: bash platforms/ci/test.sh

  build-qt5:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Kobo Qt5 firmware
        env:
          CONTAINER_ENGINE: docker
        run: bash platforms/ci/build.sh qt5
      - name: Version Qt5 ZIP
        run: |
          mv build/release/Kobalt-qt5.zip "build/release/Kobalt-HU-Dictionary-CPHUN224-TEST-${{ github.run_number }}-Qt5.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kobalt-hu-dictionary-cphun224-test-${{ github.run_number }}-qt5
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

