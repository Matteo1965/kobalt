name: Hungarian Edition beta 5 Dropcap Port Qt5 Test

on:
  push:
    branches: [hungarian-edition-beta5-dropcap-port-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobalt-hu-beta5-dropcap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CRengine patch application against pinned source
        run: bash platforms/ci/check-crengine-patches.sh
      - name: Validate beta5 source
        run: |
          python3 -m unittest discover -s tests/hyphenation -p 'test_*.py' -v
          bash platforms/ci/test.sh

  build-qt5:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build beta5 Qt5 with Extended HU Hyphenation
        env:
          CONTAINER_ENGINE: docker
          KOBALT_RELEASE_VERSION: v0.4.0-beta5-HU-DROPCAP-PORT-TEST
        run: bash platforms/ci/build.sh qt5
      - uses: actions/upload-artifact@v4
        with:
          name: kobalt-hu-0.4.0-beta5-dropcap-port-${{ github.run_number }}-qt5
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
