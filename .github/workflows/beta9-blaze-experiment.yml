name: Beta 9 Blaze experimental source integration

on:
  push:
    branches: [hungarian-edition-beta9-integration]
    paths: ['.github/workflows/beta9-blaze-experiment.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge Beta 9 source locally for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kobalt Blaze Integration"
          git config user.email "kobalt-blaze@users.noreply.github.com"
          git checkout -b hungarian-edition-beta9-blaze-experiment
          git fetch --no-tags https://github.com/nicoverbruggen/kobalt.git \
            refs/tags/v1.0-beta.9:refs/remotes/upstream/beta9
          git merge --no-commit --no-ff refs/remotes/upstream/beta9 || true
          git diff --name-only -z --diff-filter=U > /tmp/kobalt-conflicts.list
          while IFS= read -r -d '' file; do
            if git show ":2:$file" > /dev/null 2>&1; then
              git checkout --ours -- "$file"
              git add -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done < /tmp/kobalt-conflicts.list
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "Unresolved merge paths remain" >&2
            exit 1
          fi
          # Beta 9 replaced the external CREngine with a vendored Blaze build.
          # The legacy desktop/Kobo CMake recipes still reference deleted
          # reader_styles.h.in, reader_hyphenation.h.in and html5.css.
          # For this isolated compile diagnostic use upstream build wiring;
          # retaining Hungarian patches is a separate explicit porting task.
          for file in \
            platforms/desktop/CMakeLists.txt \
            platforms/kobo/CMakeLists.txt \
            platforms/shared-inputs.cmake \
            dependencies/cache.cmake \
            dependencies/local-engine.cmake; do
            git show "refs/remotes/upstream/beta9:$file" > "$file"
          done
          git add platforms/desktop/CMakeLists.txt platforms/kobo/CMakeLists.txt \
            platforms/shared-inputs.cmake dependencies/cache.cmake \
            dependencies/local-engine.cmake
          git show refs/remotes/upstream/beta9:assets/en.strings > /tmp/upstream-beta9-en.strings
          python3 - <<'PY'
          from pathlib import Path
          import re
          local = Path("assets/en.strings")
          upstream = Path("/tmp/upstream-beta9-en.strings")
          key_line = re.compile(r'^\s*"([^"]+)"\s*=')
          current = local.read_text()
          upstream_lines = upstream.read_text().splitlines()
          known = set()
          for line in current.splitlines():
              match = key_line.match(line)
              if match:
                  known.add(match.group(1))
          imported = []
          for index, line in enumerate(upstream_lines):
              match = key_line.match(line)
              if not match or match.group(1) in known:
                  continue
              if index and upstream_lines[index - 1].lstrip().startswith("/* Arguments:"):
                  imported.append(upstream_lines[index - 1])
              imported.append(line)
              known.add(match.group(1))
          if imported:
              with local.open("a") as output:
                  output.write("\n/* Beta 9 upstream English fallback */\n")
                  output.write("\n".join(imported) + "\n")
          print("Imported missing upstream UI keys:", len([line for line in imported if key_line.match(line)]))
          assert '"library.about"' in local.read_text()
          PY
          git add assets/en.strings
          # Reconcile two known beta8/beta9 C++ API collisions in the
          # disposable merged tree. Fail explicitly if upstream signatures
          # change, rather than silently deleting an unrelated method.
          python3 - <<'PY'
          from pathlib import Path
          import re
          header = Path("src/app/reader_window.h")
          source = header.read_text()
          method = re.compile(
              r'\n[ \t]*virtual void physicalPageButton\(int key, int direction\)'
              r'[ \t]*\n[ \t]*\{\s*(?:Q_UNUSED\(key\);\s*pageButton\(direction\);|pageButton\(direction\);\s*Q_UNUSED\(key\);)\s*\}',
              re.MULTILINE)
          found = list(method.finditer(source))
          if len(found) != 2:
              raise SystemExit(f"Expected two page-button fallback definitions, found {len(found)}")
          source = source[:found[1].start()] + source[found[1].end():]
          assert len(list(method.finditer(source))) == 1
          header.write_text(source)

          metrics = Path("src/ui/style/metrics.h")
          source = metrics.read_text()
          old = "inline constexpr int exitGuardMilliseconds = 400;"
          if source.count(old) != 1 or "closeGuardMilliseconds" in source:
              raise SystemExit("Unexpected guard constant definitions")
          source = source.replace(
              old, old + "\n// Beta 9 scenario player compatibility; same existing guard duration.\n"
              + "inline constexpr int closeGuardMilliseconds = exitGuardMilliseconds;")
          metrics.write_text(source)
          print("Resolved duplicate physicalPageButton and legacy guard constant")
          PY
          git add src/app/reader_window.h src/ui/style/metrics.h
          # Blaze supersedes the former engine implementation. Keeping the
          # old C++ files causes missing internal headers and double objects.
          # The Hungarian engine patches still need porting into Blaze before
          # this experimental tree can be considered a release candidate.
          git rm -r -f --ignore-unmatch src/engine/crengine
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/storage/reader_storage.h")
          source = path.read_text()
          declaration = "    QString previews() const;"
          count = source.count(declaration)
          if count != 2:
              raise SystemExit(f"Expected exactly two previews declarations, got {count}")
          first = source.find(declaration)
          second = source.find(declaration, first + len(declaration))
          source = source[:second] + source[second + len(declaration):]
          assert source.count(declaration) == 1
          path.write_text(source)
          print("Removed duplicate storage preview declaration")
          PY
          git add src/storage/reader_storage.h
          # The Beta 9 engine contract extends, rather than replaces, the
          # existing shared value types: SearchCursor, SearchScope, previews,
          # text samples, chapter labels and annotation context. Adopt the
          # complete upstream superset in this disposable merge tree.
          git show refs/remotes/upstream/beta9:src/engine/types.h > src/engine/types.h
          git add src/engine/types.h
          # Port only Beta 9's user-supplied dictionary folder wrapper.
          # Hungarian StarDict lookup and morphological handling remain
          # intact. The extracted methods use the existing StarDict API.
          git show refs/remotes/upstream/beta9:src/dictionaries/stardict.h \
            > /tmp/beta9-stardict.h
          git show refs/remotes/upstream/beta9:src/dictionaries/stardict.cpp \
            > /tmp/beta9-stardict.cpp
          python3 - <<'PY'
          from pathlib import Path
          header = Path("src/dictionaries/stardict.h")
          ours = header.read_text()
          upstream = Path("/tmp/beta9-stardict.h").read_text()
          marker = "// User-supplied StarDict files"
          assert "FolderDictionaries" not in ours
          cls = upstream[upstream.index(marker):upstream.rindex("} // namespace kobalt")]
          assert "class FolderDictionaries" in cls
          assert ours.rstrip().endswith("}")
          ours = ours.rstrip()[:-1] + "\n" + cls + "} // namespace kobalt\n"
          ours = ours.replace("#include <memory>", "#include <memory>\n#include <QHash>")
          header.write_text(ours)
          upstream_cpp = Path("/tmp/beta9-stardict.cpp").read_text()
          start = upstream_cpp.index("void FolderDictionaries::prepare(")
          body = upstream_cpp[start:upstream_cpp.rindex("} // namespace kobalt")]
          body = body.replace('return fail(error, "This dictionary is not available.");',
                              'if (error) *error = "This dictionary is not available.";\n'
                              '    return false;')
          assert body.count("FolderDictionaries::") == 5
          helper = Path("src/dictionaries/folder_dictionaries.cpp")
          helper.write_text(
              '#include "stardict.h"\n'
              '#include "support/main_thread.h"\n'
              '#include <QDir>\n#include <QDirIterator>\n#include <QFile>\n'
              '#include <QFileInfo>\n#include <QSaveFile>\n'
              '#include <algorithm>\n'
              'namespace kobalt {\n' + body + '} // namespace kobalt\n')
          print("Preserved Hungarian StarDict; added Beta 9 folder dictionary wrapper")
          PY
          git add src/dictionaries/stardict.h src/dictionaries/folder_dictionaries.cpp
          # Add only the missing preview cleanup API. No changes to
          # Hungarian preview storage formats or the existing PreviewStore.
          python3 - <<'PY'
          from pathlib import Path
          header = Path("src/storage/preview_store.h")
          source = header.read_text()
          needle = "namespace kobalt::storage {\n"
          assert source.count(needle) == 1
          assert "removePreviewFiles" not in source
          header.write_text(source.replace(
              needle,
              needle + "// Delete only private hashed .preview files, including direct child folders.\n"
              + "bool removePreviewFiles(const QString &directory);\n"))
          file = Path("src/storage/preview_cleanup.cpp")
          file.write_text(r'''#include "preview_store.h"
          #include "support/main_thread.h"
          #include <QDir>
          #include <QFile>
          #include <QFileInfo>
          #include <QRegularExpression>
          namespace kobalt::storage {
          bool removePreviewFiles(const QString &directory)
          {
              mainthread::BlockingOperation operation("preview-remove");
              if (directory.isEmpty())
                  return false;
              QStringList folders{ directory };
              for (const auto &info : QDir(directory).entryInfoList(
                       QDir::Dirs | QDir::NoDotAndDotDot | QDir::NoSymLinks))
                  folders.append(info.absoluteFilePath());
              const QRegularExpression hashed(QStringLiteral("^[0-9a-f]{64}\\.preview$"));
              bool ok = true;
              for (const auto &folder : folders)
                  for (const auto &info : QDir(folder).entryInfoList(
                           { QStringLiteral("*.preview") }, QDir::Files | QDir::NoSymLinks))
                      if (hashed.match(info.fileName()).hasMatch())
                          ok = QFile::remove(info.absoluteFilePath()) && ok;
              return ok;
          }
          } // namespace kobalt::storage
          '''.replace("\n          ", "\n"))
          print("Added preview cleanup without replacing Hungarian preview store")
          PY
          git add src/storage/preview_store.h src/storage/preview_cleanup.cpp
          git commit -m "Experiment: Blaze beta9 source with Hungarian conflict baselines and missing English keys"
          echo "Blaze source present: $(test -f src/engine/blaze/adapter/engine_document.cpp && echo yes || echo no)"
          echo "Unresolved conflicts: $(git diff --name-only --diff-filter=U | wc -l)"
      - name: Check merged source conventions
        continue-on-error: true
        run: cmake -P platforms/checks/source-checks.cmake
      - name: Test native compilation of experimental Blaze source
        run: bash platforms/ci/native-tests.sh
      - name: Explain experimental status
        if: always()
        run: echo "Experiment only; no firmware was released or installed."
