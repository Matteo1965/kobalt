name: Hungarian Edition beta 5 UI Optical Margin Qt5 Test

on:
  push:
    branches: [hungarian-edition-beta5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobalt-hu-beta5-hyph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate beta5 source
        run: bash platforms/ci/test.sh

  build-qt5:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build beta5 Qt5 with Extended HU Hyphenation
        env:
          CONTAINER_ENGINE: docker
          KOBALT_RELEASE_VERSION: v0.4.0-beta5-HU-UI-OPTICAL-TEST
        run: bash platforms/ci/build.sh qt5
      - uses: actions/upload-artifact@v4
        with:
          name: kobalt-hu-0.4.0-beta5-ui-optical-${{ github.run_number }}-qt5
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
