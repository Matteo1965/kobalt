name: Hungarian Edition - beta7 Hungarian Keyboard Qt5

on:
  push:
    branches: [hungarian-edition-beta7-hu-keyboard-qt5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hu-beta7-hu-keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify retained Hungarian features
        run: python3 tests/integration/test_hu_beta6_lowrisk.py
      - name: Validate release tooling
        run: bash platforms/ci/test.sh
      - name: Verify package scope and localized preferences
        run: |
          python3 - <<'PY'
          from pathlib import Path
          locale = Path("assets/hu.strings").read_text()
          for key in ("settings.light_gesture_feedback", "settings.light_gesture_feedback_description",
                      "settings.hanging_punctuation", "settings.hanging_punctuation_description"):
              assert f'"{key}"' in locale, key
          settings = Path("src/app/reader/settings/settings_panel.cpp").read_text()
          assert "rrLightDarkModeShortcut" not in settings
          refresh = Path("src/app/reader/window/reader_refresh.cpp").read_text()
          assert "setDarkModeShortcut(true, dark, darkEnabled)" in refresh
          sync = Path("src/sync/kosync.cpp").read_text()
          assert "object.size() == 1" in sync and "timedOut" in sync
          panel = Path("src/app/reader/settings/settings_panel.cpp").read_text()
          assert 'reader_native_rail_text' in panel
          assert 'rrChapterGroups' in panel
          chapter = Path("src/app/reader/panels/chapter_contents.cpp").read_text()
          assert 'toggleGroup' in chapter and 'rebuildVisible' in chapter
          assert '"settings.chapter_groups_current"' in locale
          assert '"buttons.upper"' in locale and '"buttons.next"' in locale
          assert 'rrButtonControls' in panel
          assert 'pageButtons::direction' in Path("src/app/reader/window/reader.cpp").read_text()
          keyboard = Path("src/ui/controls/keyboard.cpp").read_text()
          host = Path("platforms/kobo/common/reader_host_services.cpp").read_text()
          for vowel in "áéíóöőúüű":
              assert vowel in keyboard, vowel
          assert 'qwertzuiopőú' in keyboard
          assert 'ui::makeWidgetKeyboard(parent, editor, QStringLiteral("hu"))' in host
          assert 'strings::language()' in host
          assert '"widgetKeyboardShift"' in Path("tests/desktop.cpp").read_text()
          PY

  native-tests:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native regression suite
        env:
          KOBALT_TEST_INTERFACE_LANGUAGE: en
        run: bash platforms/ci/native-tests.sh

  build-kobo-qt5:
    needs: [validation, native-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Qt5 package
        env:
          CONTAINER_ENGINE: docker
          KOBALT_RELEASE_VERSION: v1.0-beta6-HU-B7-HU-KEYBOARD
        run: bash platforms/ci/build.sh qt5
      - uses: actions/upload-artifact@v4
        with:
          name: kobalt-hu-beta7-hu-keyboard-${{ github.run_number }}-qt5
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
